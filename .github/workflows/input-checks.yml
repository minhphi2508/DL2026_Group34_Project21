name: Windows input checks
on:
  push:
  pull_request:
jobs:
  input-checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.5.2 pillow==12.3.0 opencv-python-headless==4.14.0.94
      - run: python -m unittest discover -s tests -v
